
name: Testes automatizados - Comissiona

on:
  push:
    branches:
      - main
      - melhoria/revisao-tecnica
  pull_request:
    branches:
      - main

jobs:
  testes:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          python -m pip install Flask Flask-SQLAlchemy SQLAlchemy python-dotenv
          python -m pip install -r requirements.txt

      - name: Verificar dependencias
        run: |
          python -m pip show python-dotenv
          python -m pip show SQLAlchemy

      - name: Executar testes
        run: python testar_comissiona.py