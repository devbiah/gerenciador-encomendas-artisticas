{% extends "base.html" %}

{% block title %}Nova encomenda | Comissiona{% endblock %}

{% block content %}

<div class="page-header">
    <div>
        <h1>Nova encomenda</h1>
        <p>Registre uma nova encomenda artística.</p>
    </div>
</div>

<div class="content-card form-card">

    <form method="POST" enctype="multipart/form-data">

        <div class="form-group">
            <label for="titulo">Título da encomenda</label>
            <input
                type="text"
                id="titulo"
                name="titulo"
                placeholder="Ex.: Ilustração de personagem"
                required
            >
        </div>

        <div class="form-group">
            <label for="cliente_id">Cliente</label>
            <select id="cliente_id" name="cliente_id" required>
                <option value="">Selecione um cliente</option>

                {% for cliente in clientes %}
                    <option value="{{ cliente.id }}">
                        {{ cliente.nome }}
                    </option>
                {% endfor %}
            </select>
        </div>

        <div class="form-group">
            <label for="descricao">Descrição</label>
            <textarea
                id="descricao"
                name="descricao"
                placeholder="Descreva os detalhes da encomenda"
            ></textarea>
        </div>

        <div class="form-group">
            <label for="tipo">Tipo de trabalho</label>
            <input
                type="text"
                id="tipo"
                name="tipo"
                placeholder="Ex.: Ilustração digital"
            >
        </div>

        <div class="form-group">
            <label for="prazo">Prazo de entrega</label>
            <input type="date" id="prazo" name="prazo">
        </div>

        <div class="form-group">
            <label for="valor">Valor (R$)</label>
            <input
                type="number"
                id="valor"
                name="valor"
                min="0.01"
                step="0.01"
                placeholder="150.00"
                required
            >
        </div>

        <div class="form-group">
            <label for="status">Status</label>
            <select id="status" name="status">
                <option value="Pendente">Pendente</option>
                <option value="Em andamento">Em andamento</option>
                <option value="Concluída">Concluída</option>
            </select>
        </div>

        <div class="form-group">
            <label for="imagens">Referências visuais</label>
            <input
                type="file"
                id="imagens"
                name="imagens"
                accept="image/png,image/jpeg,image/gif,image/webp"
                multiple
            >
            <small>
                Você pode selecionar várias imagens de referência.
            </small>
        </div>

        <div class="form-group">
            <label for="observacoes">Observações</label>
            <textarea
                id="observacoes"
                name="observacoes"
                placeholder="Adicione instruções, detalhes ou informações importantes..."
            ></textarea>
        </div>

        <div class="form-actions">
            <a
                href="{{ url_for('encomendas.listar_encomendas') }}"
                class="btn-secondary"
            >
                Cancelar
            </a>

            <button type="submit" class="btn-primary">
                Salvar encomenda
            </button>
        </div>

    </form>

</div>

{% endblock %}
